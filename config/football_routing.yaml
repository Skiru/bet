# Football routing precedence configuration
routing:
  current_discovery:
    routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
      - provider: football-data
        competition_scope: football:competition_supported
        season_scope: current
        mode: shadow
        selectable_status: NOT_TESTED
      - provider: api-football
        competition_scope: football:*
        season_scope: current
        mode: shadow
        selectable_status: PLAN_RESTRICTED_CURRENT
  current_form:
    routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
  historical_form_h2h:
    routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
  standings:
    routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
      - provider: football-data
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: NOT_TESTED
  detailed_metrics:
    routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
  advanced_xg:
    routes:
      - provider: understat
        competition_scope: football:Premier League|La Liga|Bundesliga|Serie A|Ligue 1|RFPL
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SHADOW
