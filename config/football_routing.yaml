# Football routing precedence configuration
routing:
  current_discovery:
    production_routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
      - provider: football-data
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
    candidate_routes:
      - provider: api-football
        competition_scope: football:*
        season_scope: current
        mode: shadow
        selectable_status: PLAN_RESTRICTED_CURRENT
  current_form:
    production_routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
      - provider: highlightly
        competition_scope: football:eng.1
        season_scope: current-season-completed
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
  historical_form_h2h:
    production_routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
      - provider: highlightly
        competition_scope: football:eng.1
        season_scope: current-season-completed
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
  standings:
    production_routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
      - provider: football-data
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
    candidate_routes: []
  detailed_metrics:
    production_routes:
      - provider: espn
        competition_scope: football:eng.1
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
      - provider: highlightly
        competition_scope: football:eng.1
        season_scope: current-season-completed
        mode: shadow
        selectable_status: CERTIFIED_SELECTABLE
    shadow_routes:
      - provider: sportdb
        competition_scope: football:eng.1
        season_scope: current-season-completed
        mode: shadow
        selectable_status: CERTIFIED_SHADOW
  advanced_xg:
    shadow_routes:
      - provider: understat
        competition_scope: football:Premier League|La Liga|Bundesliga|Serie A|Ligue 1|RFPL
        season_scope: current
        mode: shadow
        selectable_status: CERTIFIED_SHADOW
