name: Pipeline V5 CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate & Test Pipeline V5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lockfile Check
        run: uv lock --check

      - name: Code Formatter Check
        run: uv run ruff format --check .

      - name: Linter Check
        run: uv run ruff check .

      - name: Run Production Validators
        run: |
          uv run python scripts/validate_production_surface.py
          uv run python scripts/validate_power_agent_control_plane.py
          uv run python scripts/validate_manifest_power_agents.py
          uv run python scripts/validate_database_access.py
          uv run python scripts/validate_reachability_graph.py

      - name: Run Pipeline V5 Checkpoint Test Suites
        run: |
          uv run pytest tests/test_c1_step_contracts.py tests/test_c2_sharding_and_acquisition.py tests/test_c3_sport_intelligence.py tests/test_c4_model_governance.py tests/test_c5_bet_builder.py

      - name: Run Full Pytest Suite
        run: uv run pytest -n auto
