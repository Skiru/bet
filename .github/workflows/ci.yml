name: sofa CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sofa:
    name: sofa tests and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7312eed977e2852fe36e09849206 # v5.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8878411b069d2e1d713c77840ecdd342c3886561 # v5.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Tests (offline)
        run: uv run pytest tests/sofa -q

      - name: Types
        run: uv run mypy --strict src/bet/sofa scripts/sofa
