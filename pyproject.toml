[project]
name = "bet-pipeline"
version = "2.0.0"
description = "Manifest-driven betting infrastructure with bounded provider and database access"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "PyYAML>=6.0,<7",
    "soccerdata>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.8,<3",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scripts/_archive", ".venv", ".kilo", ".kilocode"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "api_sports_live: live API-Sports certification tests requiring explicit opt-in",
    "espn_live: live ESPN integration tests requiring network access and explicit opt-in",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["src/bet"]

[tool.hatch.build.targets.wheel.force-include]
"config/provider_registry.json" = "bet/config/provider_registry.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
